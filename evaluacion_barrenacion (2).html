<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> index.htm/title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* ===================================================================
     TABLA DE COLORES / TOKENS DE DISEÑO
     Edita estos valores para cambiar la paleta de toda la app.
     =================================================================== */
  :root{
    --navy-deep:      #0A0A0A;   /* fondo header / superficies oscuras (negro Sandvik) */
    --navy-panel:     #1A1A1A;   /* paneles oscuros secundarios */
    --ink:            #111111;  /* texto principal */
    --paper:          #FFFFFF;  /* fondo general de la app */
    --card:           #FFFFFF;   /* fondo de tarjetas */
    --line:           #E2E2E2;   /* bordes suaves */

    --accent-blue:    #1C7EA6;   /* Conocer/Comprender/Evaluar azul (color del marcador en el diagrama) */
    --accent-red:     #D64541;   /* Conocer/Comprender/Analizar rojo (color del marcador en el diagrama) */
    --accent-green:   #2E9E5B;   /* Aplicar verde (color del marcador en el diagrama) */
    --accent-gold:    #A08C64;   /* dorado de marca — rgb(160,140,100) */

    --ok:             #2E9E5B;
    --warn:           #A08C64;
    --bad:            #D64541;

    --font-display: 'Oswald', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-gold); color:var(--navy-deep); }

  h1,h2,h3,.display{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:0;
  }

  .app{ max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  header.topbar{
    background:var(--navy-deep);
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .brandmark{ display:flex; align-items:center; gap:14px; }
  .brandmark img{ height:22px; width:auto; display:block; }
  .brandmark .divider{ width:1px; height:26px; background:rgba(255,255,255,.2); }
  .brandmark .text{ display:flex; flex-direction:column; gap:2px; }
  .brandmark .eyebrow{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
    color:var(--accent-gold); text-transform:uppercase;
  }
  .brandmark .title{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.03em; }
  .timer{
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:500;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    padding:6px 14px;
    border-radius:6px;
    min-width:92px;
    text-align:center;
    letter-spacing:.04em;
  }
  .timer.running{ border-color:var(--accent-gold); color:var(--accent-gold); }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .music-toggle{
    width:38px; height:38px; border-radius:8px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .music-toggle.on{ border-color:var(--accent-gold); background:rgba(160,140,100,.18); }

  main{ flex:1; padding:20px 20px 60px; }

  /* ---------- Login screen ---------- */
  .hero{
    text-align:center;
    padding:36px 8px 8px;
  }
  .hero .kicker{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em;
    color:var(--accent-blue); text-transform:uppercase; margin-bottom:10px;
  }
  .hero h1{ font-size:30px; line-height:1.15; color:var(--navy-deep); }
  .hero p.sub{ font-family:var(--font-body); color:#5b6470; margin-top:10px; font-size:15px; }

  .bloom-strip{
    display:flex; justify-content:center; gap:6px; margin:22px 0 30px; flex-wrap:wrap;
  }
  .bloom-chip{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    padding:5px 10px; border-radius:100px; border:1px solid var(--line); color:#7a7365; background:#fff;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    margin-bottom:16px;
  }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#42484f; }
  input[type=text]{
    width:100%; padding:12px 14px; font-size:16px; font-family:var(--font-body);
    border:1.5px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--accent-blue); }
  .field{ margin-bottom:16px; }

  button.primary{
    width:100%;
    background:var(--navy-deep);
    color:#fff;
    border:none;
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:15px;
    padding:15px 20px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button.primary:hover{ background:#173a5c; }
  button.primary:active{ transform:scale(.99); }
  button.primary:disabled{ background:#b9bcc0; cursor:not-allowed; }

  button.ghost{
    width:100%;
    background:transparent;
    color:var(--navy-deep);
    border:1.5px solid var(--line);
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
  }
  button.ghost:hover{ border-color:var(--navy-deep); }

  /* ---------- Diagram ---------- */
  .diagram-card{ padding:14px; }
  .diagram-card img{ width:100%; display:block; border-radius:6px; cursor:zoom-in; }
  .diagram-caption{ font-size:12px; color:#7a7f87; text-align:center; margin-top:8px; font-family:var(--font-mono); }

  .zoom-overlay{
    display:none; position:fixed; inset:0; background:rgba(11,33,56,.92); z-index:200;
    align-items:center; justify-content:center; padding:20px;
  }
  .zoom-overlay.open{ display:flex; }
  .zoom-overlay img{ max-width:100%; max-height:100%; border-radius:8px; }
  .zoom-overlay .close-zoom{
    position:absolute; top:18px; right:18px; background:rgba(255,255,255,.12); color:#fff;
    border:1px solid rgba(255,255,255,.3); border-radius:100px; width:38px; height:38px; font-size:18px;
    cursor:pointer;
  }

  /* ---------- Question sections ---------- */
  .q-section{ border-left:5px solid var(--line); padding-left:0; }
  .q-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .dot{ width:14px; height:14px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(0,0,0,.03); }
  .dot.blue{ background:var(--accent-blue); }
  .dot.red{ background:var(--accent-red); }
  .dot.green{ background:var(--accent-green); }
  .dot.gold{ background:var(--accent-gold); }
  .q-level{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#8a8579; }
  .q-level b{ color:var(--ink); font-family:var(--font-display); font-size:14px; letter-spacing:.02em; text-transform:uppercase; }
  .q-prompt{ font-size:14.5px; color:#3c424a; margin:8px 0 14px; line-height:1.5; }
  textarea{
    width:100%; min-height:80px; padding:12px 14px; font-size:15px; font-family:var(--font-body);
    border:1.5px solid var(--line); border-radius:7px; resize:vertical; color:var(--ink); line-height:1.4;
  }
  .q-section.blue{ border-left-color:var(--accent-blue); }
  .q-section.red{ border-left-color:var(--accent-red); }
  .q-section.green{ border-left-color:var(--accent-green); }
  .q-section.gold{ border-left-color:var(--accent-gold); }
  .card.q-section{ padding-left:20px; }

  /* ---------- Results ---------- */
  .score-hero{ text-align:center; padding:20px 0 6px; }
  .score-big{ font-family:var(--font-display); font-size:64px; color:var(--navy-deep); line-height:1; }
  .score-big span{ font-size:26px; color:#8a8579; }
  .score-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8a8579; margin-top:6px; }

  .level-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .level-row:last-child{ border-bottom:none; }
  .level-row .dot{ margin-top:0; }
  .level-row .name{ flex:1; font-weight:600; font-size:14px; }
  .level-row .name small{ display:block; font-weight:400; color:#8a8579; font-size:11.5px; margin-top:2px; }
  .bar-track{ flex:1; max-width:120px; height:8px; border-radius:100px; background:#EDE9DD; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; }
  .pct{ font-family:var(--font-mono); font-size:13px; width:42px; text-align:right; }
  .pill{ font-family:var(--font-mono); font-size:10px; padding:3px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:.05em; }
  .pill.ok{ background:rgba(46,158,91,.12); color:var(--ok); }
  .pill.bad{ background:rgba(214,69,65,.12); color:var(--bad); }
  .pill.manual{ background:rgba(217,164,65,.15); color:#9c7626; }

  footer.foot{
    text-align:center; padding:24px 20px 40px; font-size:12px; color:#9a9689;
  }
  footer.foot a{ color:#6c7076; text-decoration:underline; cursor:pointer; }

  /* ---------- Admin ---------- */
  .admin-lock{ max-width:340px; margin:60px auto; text-align:center; }
  table.admin-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.admin-table th, table.admin-table td{ padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.admin-table th{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#7a7f87; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .admin-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .admin-actions{ display:flex; gap:8px; }
  .btn-small{
    font-family:var(--font-body); font-weight:600; font-size:12.5px; padding:9px 14px; border-radius:7px;
    border:1.5px solid var(--line); background:#fff; cursor:pointer; color:var(--navy-deep);
  }
  .btn-small.solid{ background:var(--navy-deep); color:#fff; border-color:var(--navy-deep); }
  .empty-state{ text-align:center; padding:50px 20px; color:#9a9689; font-size:14px; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  @media (max-width:480px){
    .score-big{ font-size:52px; }
    .hero h1{ font-size:24px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brandmark">
      <img id="logoImg" src="" alt="Sandvik">
      <div class="divider"></div>
      <div class="text">
        <div class="eyebrow">Tec Jr</div>
        <div class="title">Sistema de Barrenación</div>
      </div>
    </div>
    <div class="topbar-actions">
      <audio id="bgAudio" style="display:none;"></audio>
      <button id="btnMusic" class="music-toggle" title="Música ambiente">🔇</button>
      <div id="timerDisplay" class="timer">00:00</div>
    </div>
  </header>

  <main>

    <!-- ============ LOGIN ============ -->
    <section id="screen-login" class="screen active">
      <div class="hero">
        <img id="logoImgHero" src="" alt="Sandvik" style="height:26px; margin-bottom:22px;">
        <div class="kicker">Evaluación técnica · Taxonomía de Bloom</div>
        <h1>Identificación de componentes<br>del sistema de barrenación</h1>
        <p class="sub">Responde las 6 secciones del ejercicio observando el diagrama y consultando el manual de partes cuando se indique.</p>
      </div>
      <div class="bloom-strip">
        <span class="bloom-chip">1 Conocer</span>
        <span class="bloom-chip">2 Comprender</span>
        <span class="bloom-chip">3 Aplicar</span>
        <span class="bloom-chip">4 Analizar</span>
        <span class="bloom-chip">5 Evaluar</span>
        <span class="bloom-chip">6 Crear</span>
      </div>

      <div class="card">
        <div class="field">
          <label for="inpNombre">Nombre del participante</label>
          <input type="text" id="inpNombre" placeholder="Ej. Juan Pérez López">
        </div>
        <div class="field">
          <label for="inpEmpleado">Número de empleado</label>
          <input type="text" id="inpEmpleado" placeholder="Ej. 40217">
        </div>
        <button class="primary" id="btnStart">Iniciar ejercicio</button>
      </div>

      <footer class="foot"><a id="linkAdmin">Panel del instructor</a></footer>
    </section>

    <!-- ============ EXAM ============ -->
    <section id="screen-exam" class="screen">

      <div class="card diagram-card">
        <img id="diagramImg" src="" alt="Diagrama del bloque de barrenación">
        <div class="diagram-caption">Toca la imagen para ampliar · azul / rojo / verde marcan los componentes de referencia</div>
      </div>

      <div class="zoom-overlay" id="zoomOverlay">
        <button class="close-zoom" id="closeZoom">✕</button>
        <img id="zoomImg" src="" alt="Diagrama ampliado">
      </div>

      <!-- 1. Conocer -->
      <div class="card q-section blue">
        <div class="q-head"><span class="dot blue"></span><span class="q-level"><b>1 · Conocer</b></span></div>
        <p class="q-prompt">Observe el componente e identifique el elemento señalado en color <b>azul</b>.</p>
        <textarea id="q1_azul" placeholder="Nombre del componente azul..."></textarea>
      </div>
      <div class="card q-section red">
        <div class="q-head"><span class="dot red"></span><span class="q-level"><b>1 · Conocer</b></span></div>
        <p class="q-prompt">Identifique el elemento señalado en color <b>rojo</b>.</p>
        <textarea id="q1_rojo" placeholder="Nombre del componente rojo..."></textarea>
      </div>

      <!-- 2. Comprender -->
      <div class="card q-section blue">
        <div class="q-head"><span class="dot blue"></span><span class="q-level"><b>2 · Comprender</b></span></div>
        <p class="q-prompt">Describa con sus propias palabras la <b>función</b> del componente azul.</p>
        <textarea id="q2_azul" placeholder="Función del componente azul..."></textarea>
      </div>
      <div class="card q-section red">
        <div class="q-head"><span class="dot red"></span><span class="q-level"><b>2 · Comprender</b></span></div>
        <p class="q-prompt">Describa con sus propias palabras la <b>función</b> del componente rojo.</p>
        <textarea id="q2_rojo" placeholder="Función del componente rojo..."></textarea>
      </div>

      <!-- 3. Aplicar -->
      <div class="card q-section green">
        <div class="q-head"><span class="dot green"></span><span class="q-level"><b>3 · Aplicar</b></span></div>
        <p class="q-prompt">Utilizando el diagrama, describa hacia dónde va la conexión señalada en color <b>verde</b>, indicando su origen y destino.</p>
        <textarea id="q3_verde" placeholder="Origen y destino de la conexión verde..."></textarea>
      </div>

      <!-- 4. Analizar -->
      <div class="card q-section red">
        <div class="q-head"><span class="dot red"></span><span class="q-level"><b>4 · Analizar</b></span></div>
        <p class="q-prompt">Utilizando el manual de partes, identifique el <b>número de parte</b> del componente marcado en rojo, indique a cuántos <b>N·m</b> lleva de torque, a qué componentes suministra presión y a qué presión está regulado.</p>
        <textarea id="q4_rojo" placeholder="Número de parte, torque, componentes a los que suministra presión, presión regulada..." style="min-height:110px;"></textarea>
      </div>

      <!-- 5. Evaluar -->
      <div class="card q-section blue">
        <div class="q-head"><span class="dot blue"></span><span class="q-level"><b>5 · Evaluar</b></span></div>
        <p class="q-prompt">Utilizando sus conocimientos, escriba las <b>dos formas</b> en las que puede ser piloteada la válvula señalada en color azul.</p>
        <textarea id="q5_azul" placeholder="Las dos formas de pilotaje..."></textarea>
      </div>

      <!-- 6. Crear -->
      <div class="card q-section gold">
        <div class="q-head"><span class="dot gold"></span><span class="q-level"><b>6 · Crear</b></span></div>
        <p class="q-prompt">Describa una planeación de pruebas de funcionamiento del sistema, proponiendo <b>3 pruebas concretas</b> que permitan comprobar su correcto funcionamiento.</p>
        <textarea id="q6_crear" placeholder="Prueba 1, prueba 2, prueba 3..." style="min-height:110px;"></textarea>
      </div>

      <button class="primary" id="btnSubmit">Finalizar y calificar</button>
    </section>

    <!-- ============ RESULTS ============ -->
    <section id="screen-done" class="screen">
      <div class="card">
        <div class="score-hero">
          <div class="score-big" id="scoreBig">0<span>%</span></div>
          <div class="score-label">Calificación automática (niveles 1–5)</div>
        </div>
        <div id="levelBreakdown" style="margin-top:18px;"></div>
      </div>
      <div class="card">
        <p style="font-size:13px; color:#6c7076; line-height:1.6; margin:0;">
          El nivel <b>6 · Crear</b> es de respuesta abierta y requiere revisión manual del instructor — se guardó junto con el resto de tus respuestas.
        </p>
      </div>
      <button class="primary" id="btnRestart">Nuevo participante</button>
    </section>

    <!-- ============ ADMIN ============ -->
    <section id="screen-admin" class="screen">
      <div id="adminLockWrap" class="admin-lock">
        <h2 style="font-size:20px; margin-bottom:14px;">Panel del instructor</h2>
        <div class="field" style="text-align:left;">
          <label for="adminPass">Contraseña</label>
          <input type="text" id="adminPass" placeholder="••••••">
        </div>
        <button class="primary" id="btnAdminEnter">Entrar</button>
        <button class="ghost" id="btnAdminBack">Volver</button>
      </div>

      <div id="adminPanel" style="display:none;">

        <div class="card" style="margin-bottom:20px;">
          <h2 style="font-size:15px; margin-bottom:10px;">Compartir con participantes</h2>
          <p style="font-size:12.5px; color:#6c7076; line-height:1.5; margin:0 0 12px;">
            Sube este archivo a un sitio con URL pública (GitHub Pages, Google Sites, servidor de la empresa, etc.), pega esa URL aquí y genera el código QR para que los participantes lo escaneen desde su celular.
          </p>
          <div class="field" style="margin-bottom:10px;">
            <input type="text" id="qrUrlInput" placeholder="https://tu-sitio.com/evaluacion_barrenacion.html">
          </div>
          <button class="btn-small solid" id="btnGenQr" style="width:100%;">Generar código QR</button>
          <div id="qrResult" style="display:none; text-align:center; margin-top:16px;">
            <div id="qrCanvasHolder" style="display:inline-block; padding:12px; background:#fff; border:1px solid var(--line); border-radius:8px;"></div>
            <div><button class="btn-small" id="btnDownloadQr" style="margin-top:10px;">Descargar QR (PNG)</button></div>
          </div>
        </div>

        <div class="admin-topbar">
          <h2 style="font-size:18px;">En curso ahora</h2>
          <div class="admin-actions">
            <button class="btn-small" id="btnAdminRefresh">Actualizar</button>
          </div>
        </div>
        <div class="table-wrap" style="margin-bottom:24px;">
          <div id="inProgressHolder"></div>
        </div>

        <div class="admin-topbar">
          <h2 style="font-size:18px;">Resultados completados</h2>
          <div class="admin-actions">
            <button class="btn-small solid" id="btnAdminCsv">Descargar CSV</button>
            <button class="btn-small" id="btnAdminBack2">Volver</button>
          </div>
        </div>
        <div class="table-wrap">
          <div id="adminTableHolder"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
/* =====================================================================

/* =====================================================================
   UTILIDADES
   ===================================================================== */
function normalize(str){
  return (str||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function scoreAnswer(id, text){
  const key = ANSWER_KEY[id];
  if(!key) return null;
  const norm = normalize(text);
  let matched = 0;
  key.concepts.forEach(syns=>{
    if(syns.some(s=> norm.includes(normalize(s)))) matched++;
  });
  return { matched, total:key.concepts.length, pct: Math.round((matched/key.concepts.length)*100) };
}
function fmtTime(totalSeconds){
  const m = Math.floor(totalSeconds/60).toString().padStart(2,"0");
  const s = Math.floor(totalSeconds%60).toString().padStart(2,"0");
  return m+":"+s;
}

const MUSIC_FILE = "musica_fondo.mp3";
const bgAudio = document.getElementById("bgAudio");
bgAudio.src = MUSIC_FILE;
bgAudio.loop = true;
bgAudio.volume = 0.4;
let useRealTrack = true;
bgAudio.addEventListener("error", ()=>{ useRealTrack = false; }); // si no encuentra el mp3, cae al generador

let audioCtx = null;
let musicOn = false;
let ambientTimers = [];

// Progresión de acordes (notas en Hz) — Am7 · Fmaj7 · C · G, un ciclo relajado tipo "focus music"
const CHORDS = [
  [110.00, 130.81, 164.81, 196.00],   // Am7
  [87.31, 110.00, 130.81, 174.61],    // Fmaj7
  [130.81, 164.81, 196.00, 246.94],   // C
  [98.00, 123.47, 146.83, 196.00],    // G
];
const CHORD_DURATION = 7; // segundos por acorde

function buildAmbientEngine(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const master = audioCtx.createGain();
  master.gain.value = 0.0001;
  master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 3); // entrada suave

  const padGain = audioCtx.createGain();
  padGain.gain.value = 1;
  padGain.connect(master);

  const pluckGain = audioCtx.createGain();
  pluckGain.gain.value = 0.5;
  pluckGain.connect(master);

  let chordIndex = 0;

  function playChord(notes){
    const now = audioCtx.currentTime;
    notes.forEach((f, i)=>{
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(0.05, now + 1.2);
      g.gain.linearRampToValueAtTime(0, now + CHORD_DURATION - 0.5);
      const lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.06 + i*0.015;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.012;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      osc.connect(g);
      g.connect(padGain);
      osc.start(now);
      lfo.start(now);
      osc.stop(now + CHORD_DURATION + 0.2);
      lfo.stop(now + CHORD_DURATION + 0.2);
    });
  }

  function playPluck(freq){
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.045, now + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
    osc.connect(g);
    g.connect(pluckGain);
    osc.start(now);
    osc.stop(now + 1.7);
  }

  function scheduleChords(){
    playChord(CHORDS[chordIndex]);
    const notes = CHORDS[chordIndex];
    chordIndex = (chordIndex + 1) % CHORDS.length;
    ambientTimers.push(setTimeout(scheduleChords, CHORD_DURATION * 1000));

    // arpegio suave sobre el acorde actual (una nota cada ~1.6s, una octava arriba)
    let step = 0;
    const arpInterval = setInterval(()=>{
      if(!musicOn){ clearInterval(arpInterval); return; }
      playPluck(notes[step % notes.length] * 2);
      step++;
    }, 1600);
    ambientTimers.push(arpInterval);
  }

  scheduleChords();
}

function stopAmbientEngine(){
  ambientTimers.forEach(t=>{ clearTimeout(t); clearInterval(t); });
  ambientTimers = [];
  if(audioCtx){ audioCtx.close(); audioCtx = null; }
}

document.getElementById("btnMusic").addEventListener("click", ()=>{
  const btn = document.getElementById("btnMusic");
  if(!musicOn){
    musicOn = true;
    btn.textContent = "🔊";
    btn.classList.add("on");
    if(useRealTrack){
      bgAudio.play().catch(()=>{ useRealTrack = false; buildAmbientEngine(); });
    }else{
      buildAmbientEngine();
    }
  }else{
    musicOn = false;
    btn.textContent = "🔇";
    btn.classList.remove("on");
    if(useRealTrack){
      bgAudio.pause();
    }else{
      stopAmbientEngine();
    }
  }
});

/* =====================================================================
   CRONÓMETRO
   ===================================================================== */
let timerInterval = null;
let elapsedSeconds = 0;
let startedAt = null;
function startTimer(){
  elapsedSeconds = 0;
  startedAt = Date.now();
  const disp = document.getElementById("timerDisplay");
  disp.classList.add("running");
  timerInterval = setInterval(()=>{
    elapsedSeconds = Math.floor((Date.now()-startedAt)/1000);
    disp.textContent = fmtTime(elapsedSeconds);
  }, 250);
}
function stopTimer(){
  clearInterval(timerInterval);
  document.getElementById("timerDisplay").classList.remove("running");
}

/* =====================================================================
   FLUJO: LOGIN -> EXAMEN
   ===================================================================== */
let currentParticipant = { nombre:"", empleado:"" };
let currentAttemptKey = null;

document.getElementById("btnStart").addEventListener("click", async ()=>{
  const nombre = document.getElementById("inpNombre").value.trim();
  const empleado = document.getElementById("inpEmpleado").value.trim();
  if(!nombre || !empleado){
    alert("Por favor captura tu nombre y número de empleado antes de iniciar.");
    return;
  }
  currentParticipant = { nombre, empleado };
  currentAttemptKey = "intento:" + empleado + "_" + Date.now();

  const startedAtMs = Date.now();
  const initialRecord = {
    nombre, empleado,
    status: "en_progreso",
    fechaInicio: new Date(startedAtMs).toLocaleString("es-MX"),
    startedAtMs
  };
  try{
    await window.storage.set(currentAttemptKey, JSON.stringify(initialRecord), true);
  }catch(e){ console.error("No se pudo registrar el inicio:", e); }

  document.getElementById("timerDisplay").textContent = "00:00";
  showScreen("screen-exam");
  startTimer();
});

/* Zoom de imagen */
document.getElementById("diagramImg").addEventListener("click", ()=>{
  document.getElementById("zoomOverlay").classList.add("open");
});
document.getElementById("closeZoom").addEventListener("click", ()=>{
  document.getElementById("zoomOverlay").classList.remove("open");
});
document.getElementById("zoomOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "zoomOverlay") document.getElementById("zoomOverlay").classList.remove("open");
});

/* =====================================================================
   FLUJO: EXAMEN -> FINALIZAR
   ===================================================================== */
document.getElementById("btnSubmit").addEventListener("click", async ()=>{
  const ids = ["q1_azul","q1_rojo","q2_azul","q2_rojo","q3_verde","q4_rojo","q5_azul","q6_crear"];
  const answers = {};
  ids.forEach(id=>{ answers[id] = document.getElementById(id).value.trim(); });

  const emptyCount = ids.filter(id=>!answers[id]).length;
  if(emptyCount > 0){
    if(!confirm("Dejaste " + emptyCount + " respuesta(s) en blanco. ¿Deseas finalizar de todas formas?")) return;
  }

  stopTimer();

  const scores = {};
  Object.keys(ANSWER_KEY).forEach(id=>{ scores[id] = scoreAnswer(id, answers[id]); });
  const autoPcts = Object.values(scores).map(s=>s.pct);
  const totalPct = Math.round(autoPcts.reduce((a,b)=>a+b,0)/autoPcts.length);

  const record = {
    nombre: currentParticipant.nombre,
    empleado: currentParticipant.empleado,
    status: "completado",
    fecha: new Date().toLocaleString("es-MX"),
    tiempoSegundos: elapsedSeconds,
    tiempoFmt: fmtTime(elapsedSeconds),
    answers,
    scores,
    totalPct
  };

  try{
    const key = currentAttemptKey || ("intento:" + currentParticipant.empleado + "_" + Date.now());
    await window.storage.set(key, JSON.stringify(record), true);
  }catch(e){
    console.error("No se pudo guardar el intento:", e);
  }

  renderResults(record);
  showScreen("screen-done");
});

function renderResults(record){
  document.getElementById("scoreBig").innerHTML = record.totalPct + "<span>%</span>";
  const holder = document.getElementById("levelBreakdown");
  holder.innerHTML = "";
  LEVELS.forEach(level=>{
    const pcts = level.ids.map(id=> record.scores[id] ? record.scores[id].pct : 0);
    const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    const row = document.createElement("div");
    row.className = "level-row";
    const passed = avg >= 60;
    row.innerHTML = `
      <span class="dot ${level.color}"></span>
      <span class="name">${level.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${avg}%; background:var(--accent-${level.color});"></div></div>
      <span class="pct">${avg}%</span>
      <span class="pill ${passed?'ok':'bad'}">${passed?'Correcto':'Revisar'}</span>
    `;
    holder.appendChild(row);
  });
  const rowCrear = document.createElement("div");
  rowCrear.className = "level-row";
  rowCrear.innerHTML = `
    <span class="dot gold"></span>
    <span class="name">6 · Crear<small>Respuesta abierta</small></span>
    <div class="bar-track"><div class="bar-fill" style="width:100%; background:var(--accent-gold); opacity:.35;"></div></div>
    <span class="pct">—</span>
    <span class="pill manual">Manual</span>
  `;
  holder.appendChild(rowCrear);
}

let lastRecords = [];
let adminAutoRefresh = null;

async function loadAdminTable(){
  const holder = document.getElementById("adminTableHolder");
  const progressHolder = document.getElementById("inProgressHolder");
  holder.innerHTML = '<div class="empty-state">Cargando resultados…</div>';
  progressHolder.innerHTML = '<div class="empty-state">Cargando…</div>';
  try{
    const listResult = await window.storage.list("intento:", true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    if(keys.length === 0){
      holder.innerHTML = '<div class="empty-state">Todavía no hay intentos registrados.</div>';
      progressHolder.innerHTML = '<div class="empty-state">Nadie está resolviendo el ejercicio en este momento.</div>';
      lastRecords = [];
      return;
    }
    const all = [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, true);
        if(res && res.value) all.push(JSON.parse(res.value));
      }catch(e){ /* ignora claves rotas */ }
    }
    const completed = all.filter(r=>r.status !== "en_progreso");
    const inProgress = all.filter(r=>r.status === "en_progreso");

    completed.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
    inProgress.sort((a,b)=> (b.startedAtMs||0) - (a.startedAtMs||0));

    lastRecords = completed;
    renderAdminTable(completed);
    renderInProgress(inProgress);
  }catch(e){
    holder.innerHTML = '<div class="empty-state">Error al cargar resultados: ' + e.message + '</div>';
  }
}

function renderInProgress(records){
  const holder = document.getElementById("inProgressHolder");
  if(records.length === 0){
    holder.innerHTML = '<div class="empty-state">Nadie está resolviendo el ejercicio en este momento.</div>';
    return;
  }
  let html = '<table class="admin-table"><thead><tr><th>Nombre</th><th># Empleado</th><th>Inició</th><th>Tiempo transcurrido</th></tr></thead><tbody>';
  records.forEach(r=>{
    const elapsed = Math.floor((Date.now() - (r.startedAtMs||Date.now()))/1000);
    html += `<tr><td>${escapeHtml(r.nombre)}</td><td>${escapeHtml(r.empleado)}</td><td>${escapeHtml(r.fechaInicio||"")}</td><td>${fmtTime(elapsed)}</td></tr>`;
  });
  html += "</tbody></table>";
  holder.innerHTML = html;
}

function renderAdminTable(records){
  const holder = document.getElementById("adminTableHolder");
  let html = '<table class="admin-table"><thead><tr>' +
    '<th>Nombre</th><th># Empleado</th><th>Fecha</th><th>Tiempo</th>' +
    '<th>Conocer</th><th>Comprender</th><th>Aplicar</th><th>Analizar</th><th>Evaluar</th>' +
    '<th>Total (1–5)</th><th>Crear (revisar)</th>' +
    '</tr></thead><tbody>';
  records.forEach(r=>{
    const lvl = id2 => {
      const ids = LEVELS.find(l=>l.key===id2).ids;
      const pcts = ids.map(id=> r.scores[id] ? r.scores[id].pct : 0);
      return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) + "%";
    };
    html += `<tr>
      <td>${escapeHtml(r.nombre)}</td>
      <td>${escapeHtml(r.empleado)}</td>
      <td>${escapeHtml(r.fecha)}</td>
      <td>${r.tiempoFmt}</td>
      <td>${lvl("q1")}</td>
      <td>${lvl("q2")}</td>
      <td>${lvl("q3")}</td>
      <td>${lvl("q4")}</td>
      <td>${lvl("q5")}</td>
      <td><b>${r.totalPct}%</b></td>
      <td style="max-width:220px; white-space:normal;">${escapeHtml(r.answers.q6_crear || "—")}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  holder.innerHTML = html;
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

document.getElementById("btnAdminCsv").addEventListener("click", ()=>{
  if(!lastRecords.length){ alert("No hay resultados para descargar."); return; }
  const headers = ["Nombre","Numero_empleado","Fecha","Tiempo",
    "Conocer_azul","Conocer_rojo","Comprender_azul","Comprender_rojo",
    "Aplicar_verde","Analizar_rojo","Evaluar_azul",
    "Pct_Conocer","Pct_Comprender","Pct_Aplicar","Pct_Analizar","Pct_Evaluar","Pct_Total_1_5",
    "Respuesta_Crear"];
  const rows = [headers];
  lastRecords.forEach(r=>{
    const lvlPct = id2 => {
      const ids = LEVELS.find(l=>l.key===id2).ids;
      const pcts = ids.map(id=> r.scores[id] ? r.scores[id].pct : 0);
      return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    };
    rows.push([
      r.nombre, r.empleado, r.fecha, r.tiempoFmt,
      r.answers.q1_azul, r.answers.q1_rojo, r.answers.q2_azul, r.answers.q2_rojo,
      r.answers.q3_verde, r.answers.q4_rojo, r.answers.q5_azul,
      lvlPct("q1"), lvlPct("q2"), lvlPct("q3"), lvlPct("q4"), lvlPct("q5"), r.totalPct,
      r.answers.q6_crear
    ]);
  });
  const csv = rows.map(row => row.map(cell=>{
    const s = String(cell===undefined||cell===null ? "" : cell).replace(/"/g,'""');
    return '"' + s + '"';
  }).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "resultados_barrenacion_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
